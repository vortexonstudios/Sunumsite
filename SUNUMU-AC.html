,{id:`S3`,title:`Halil Kantarcı: ailesinin anlatımı`,publisher:`Anadolu Ajansı · 21 Temmuz 2016`,url:`https://www.aa.com.tr/tr/15-temmuz-darbe-girisimi/agabeyim-omru-boyunca-darbecilerle-savasti/612639`,note:`Çengelköy’e gidişi, ailesi ve o gece yaşananlara ilişkin yakınlarının tanıklığı.`},{id:`S4`,title:`Ömer Halisdemir’in anılması`,publisher:`Millî Savunma Bakanlığı`,url:`https://www.msb.gov.tr/slaythaber/kahraman-halisdemir-sehit-dustugu-yerde-ve-saatte-anildi`,note:`Özel Kuvvetler Komutanlığı’ndaki görevi ve komutanından aldığı emirle Semih Terzi’yi durdurmasına ilişkin resmî anlatım.`},{id:`S5`,title:`Çanakkale Savaşı’nda askerin yemeği`,publisher:`M. Mutlu Karakaya · Güney-Doğu Avrupa Araştırmaları Dergisi, 29, s. 65–83`,url:`https://dergipark.org.tr/tr/download/article-file/1033447`,note:`Günlükler ve harp ceridelerine dayalı inceleme. Yaygın 1917 tarihli “hoşaf-ekmek menüsü”, Çanakkale’nin genel beslenme düzeni olarak sunulamaz.`},{id:`S6`,title:`Suriye’de çocuklar ve savaşın etkileri`,publisher:`UNICEF · 25 Mart 2025`,url:`https://www.unicef.org/press-releases/syrias-children-step-out-shadows-war-securing-their-future-more-critical-ever-unicef`,note:`Çocukların yerinden edilme ve şiddet deneyimleri hakkında genel bağlam; belirli bir kişinin biyografisini doğrulamaz.`}],uc=[{no:`01`,date:`15 TEMMUZ 2016`,title:`Bir kapının eşiğinde`,place:`Bir ev · İstanbul`,image:`room.jpg`,video:`intro.mp4`,text:`Televizyondaki darbe bildirisi, sıradan bir akşamı değiştirir. Oyuncu eşyalarını toplar ve Çanakkale gazisinin torunuyla birlikte kapıya yönelir.`,detail:`Eşyaları inceleme · Toplama · Sahne geçişi`},{no:`02`,date:`ÇANAKKALE · 1915`,title:`Yarım kalan selam`,place:`Bir siper · Çanakkale`,image:`friend.jpg`,video:`greeting.mp4`,text:`Hafıza, dedenin gençliğine açılır. Hoşaf ve ekmekle başlayan gündelik an, bir arkadaşın selamı ve ardından gelen bombardımanla kırılır.`,detail:`Sofra etkileşimi · Arkadaşlık · Kayıp`},{no:`03`,date:`15 TEMMUZ 2016`,title:`Emrin ardından`,place:`Özel Kuvvetler Komutanlığı · Ankara`,image:`command.jpg`,video:`command.mp4`,text:`Ömer Halisdemir, komutanından aldığı emrin ardından görevine doğru ilerler. Mevcut oyun akışı bu yürüyüşle son bulur.`,detail:`Telefon etkileşimi · Hazırlık · Göreve yürüyüş`}],dc=[`Neden bu proje?
“Gençlerimize tarihimizi daha iyi anlatmak istiyoruz. Çıkış noktamız şu: Gençlere ulaşmak için onların ilgi duyduğu anlatım biçimlerini de kullanmalıyız. Biz bu nedenle oyunu seçtik. İsimsiz Kahramanlar, Çanakkale ve 15 Temmuz’daki insan hikâyelerini kısa, etkileşimli videolarla anlatan sinematik bir oyun.” İsterseniz 28 saniyelik oyun seçkisini açın.`,`60 saniyede proje
Amacı, genç oyuncuları, etkileşimli video yöntemini ve mevcut üç bölümlük prototipi tek nefeste özetleyin. “Öğrenme etkisini ölçtük” demeyin; bunun hedef olduğunu belirtin.`,`Ana fikir
“Bir tarihî olayı yalnızca tarih ve yer adıyla öğrenmeyiz; onu yaşayan insanların hayatlarına yaklaşarak da anlamaya çalışırız. Oyuncunun bir eşyayı aldığı, bir sese döndüğü, hikâyenin devamına katıldığı bir deneyim kuruyoruz. Hedefimiz, oyundan sonra da devam eden merak.” Dede–torun bağının iki dönemi buluşturan dramatik kurgu olduğunu belirtin.`,`Bugün ne hazır?
“İlk bölümde, darbe bildirisini televizyonda gören bir karakter eşyalarını alıp dışarı çıkıyor. İkinci bölüm bizi Çanakkale’deki dedesinin hatırasına götürüyor. Üçüncü bölümde Ömer Halisdemir, aldığı emir üzerine görevine ilerliyor. Hazırlanmış oyun akışımız burada bitiyor.” Kartlardan bir sahneyi gösterin. Sofra sahnesi, cephedeki genel beslenme düzeni iddiası değildir.`,`Nasıl oynanıyor?
“Kısa videoların oluşturduğu bir etkileşim ağı kuruyoruz. Her videonun son karesinin, bir sonraki videonun ilk karesi olması temel tasarım kuralımız. Böylece oyuncu bir hareket yaptığında sinematik akış sürüyor. Görsel dilimiz belirgin konturlar ve el çizimi dokulara dayanıyor.” Demoda sırasıyla saat, anahtar ve telefonu alın. Bunun mevcut oyun görüntüleriyle hazırlanmış kısa web uyarlaması olduğunu söyleyin.`,`Hikâye nasıl genişliyor?
“Halil Kantarcı, Ömer Halid Dervişe ve birçok isimsiz kahramanın hikâyesiyle anlatıyı genişletiyoruz. Olayları, aile, aidiyet ve dayanışma gibi insan bağları üzerinden ele alıyoruz.” Dervişe’nin 2016’da 21 yaşında bir üniversite öğrencisi ve 15 Temmuz gazisi olduğunu belirtin. Yeni bölümler senaryo geliştirme aşamasında.`,`Bir çocuğun gözünden
“Bu tasarımda, savaşın bir çocuğun dünyasını nasıl değiştirdiğine onun bakış açısından yaklaşıyoruz. Karanlıktan ışığa çıkan kısa bir anlatı tasarlıyoruz.” Açılış videosunu başlatın; tuğlayı alıp üç kez vurun, ardından kurtarma kareleri üzerinden ilerleyin. Açılış video, devamı etkileşimli konsept kareleridir. Bu bölüm, Dervişe’nin belgelenmiş çocukluk hatırası olarak sunulmamalı; çocukluk enkaz deneyimi incelenen kaynaklarda doğrulanmış değil. Burada gösterilen, tamamlanmış yeni oyun bölümü değil, kurgu sahne tasarımı.`,`Üretimin içinden
Mevcut oyun kareleriyle yeni çizgi ve ton araştırmalarını karşılaştırın. Araştırmaların sunum için Higgsfield ile mevcut karelerden sonradan üretildiğini söyleyin. Bunlar ilk eskizler değildir. Hikâye, çizim ve kodun nasıl birbirine bağlandığını anlatın; gerekirse kısa oyun seçkisini açın.`,`Ekibimiz
“İki kişiyiz. Emirhan kodlamaya ağırlık veriyor, çizimde de yer alıyor. Abdullah çizime ağırlık veriyor. Hikâyeyi birlikte yazıyoruz.” Küçük ekibin iş paylaşımını somut olarak aktarın.`,`Hedef ve kapanış
